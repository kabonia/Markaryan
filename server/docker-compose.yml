# Запуск: docker compose up -d --build
# Caddy сам получает HTTPS‑сертификат для домена из Caddyfile.
services:
  ai:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
      - ./market-prices:/app/market-prices:ro
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - ai
volumes:
  caddy_data:
