name: Где лежат ключи (диагностика, только имена)

# Временный: показывает ИМЕНА секретов и окружений, которые видит GitHub Actions в этом репозитории,
# и тип содержимого (ключ .p8, plist, Issuer ID…). Значения не выводятся. Будет удалён после проверки.

on:
  push:
    branches: [claude/stoic-bohr-biaj4j]
    paths: [.github/workflows/keys-probe.yml]

permissions:
  contents: read
  actions: read

jobs:
  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environments: ${{ steps.envs.outputs.open }}
    steps:
      - name: Секреты репозитория — имена и тип содержимого
        env:
          ALL: ${{ toJSON(secrets) }}
        run: |
          echo "Секреты, которые видит Actions (кроме служебного github_token):"
          printf '%s' "$ALL" | jq -r '
            to_entries[] | select(.key != "github_token") | .value as $v
            | (try ($v | gsub("\\s"; "") | @base64d) catch "") as $d
            | "  \(.key) — " + (
                if ($v | contains("PRIVATE KEY")) then "ключ .p8 (текстом)"
                elif ($d | contains("PRIVATE KEY")) then "ключ .p8 (в base64)"
                elif ($v | contains("<plist")) then "plist (текстом)"
                elif ($d | contains("<plist")) then "plist (в base64)"
                elif ($v | test("^\\s*[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\\s*$")) then "похоже на Issuer ID"
                elif ($v | test("^\\s*[A-Z0-9]{10}\\s*$")) then "похоже на Key ID"
                elif ($v | test("^\\s*https?://")) then "адрес (URL)"
                elif ($v | test("^\\s*$")) then "пусто"
                else "другое" end)'
          count=$(printf '%s' "$ALL" | jq '[keys[] | select(. != "github_token")] | length')
          echo "Всего: $count"

      - name: Переменные (vars) — без значений
        run: |
          echo "Переменные вообще есть: ${{ contains(toJSON(vars), '": ') }}"
          echo "  в переменных лежит ключ .p8: ${{ contains(toJSON(vars), 'PRIVATE KEY') || contains(toJSON(vars), 'LS0tLS1CRUdJTi') }}"
          echo "  в переменных лежит plist: ${{ contains(toJSON(vars), '<plist') || contains(toJSON(vars), 'PD94bWw') }}"
          echo "  первые буквы имён переменных: A=${{ contains(toJSON(vars), '  "A') }} B=${{ contains(toJSON(vars), '  "B') }} C=${{ contains(toJSON(vars), '  "C') }} D=${{ contains(toJSON(vars), '  "D') }} E=${{ contains(toJSON(vars), '  "E') }} F=${{ contains(toJSON(vars), '  "F') }} G=${{ contains(toJSON(vars), '  "G') }} H=${{ contains(toJSON(vars), '  "H') }} I=${{ contains(toJSON(vars), '  "I') }} J=${{ contains(toJSON(vars), '  "J') }} K=${{ contains(toJSON(vars), '  "K') }} L=${{ contains(toJSON(vars), '  "L') }} M=${{ contains(toJSON(vars), '  "M') }} N=${{ contains(toJSON(vars), '  "N') }} O=${{ contains(toJSON(vars), '  "O') }} P=${{ contains(toJSON(vars), '  "P') }} Q=${{ contains(toJSON(vars), '  "Q') }} R=${{ contains(toJSON(vars), '  "R') }} S=${{ contains(toJSON(vars), '  "S') }} T=${{ contains(toJSON(vars), '  "T') }} U=${{ contains(toJSON(vars), '  "U') }} V=${{ contains(toJSON(vars), '  "V') }} W=${{ contains(toJSON(vars), '  "W') }} X=${{ contains(toJSON(vars), '  "X') }} Y=${{ contains(toJSON(vars), '  "Y') }} Z=${{ contains(toJSON(vars), '  "Z') }} _=${{ contains(toJSON(vars), '  "_') }}"

      - name: Окружения (Environments)
        id: envs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          json=$(gh api "repos/$GITHUB_REPOSITORY/environments" 2>/dev/null || echo '{}')
          echo "Окружения в репозитории:"
          printf '%s' "$json" | jq -r '.environments // [] | .[] | "  \(.name) — правила: \([.protection_rules[]?.type] | if length == 0 then "нет" else join(", ") end); ветки: \(if .deployment_branch_policy == null then "любые" elif .deployment_branch_policy.protected_branches then "только защищённые" else "выбранные" end)"'
          printf '%s' "$json" | jq -r '.total_count // 0 | "Всего окружений: \(.)"'
          # Окружения без обязательного подтверждения — проверим их секреты во второй задаче.
          echo "open=$(printf '%s' "$json" | jq -c '[.environments // [] | .[] | select([.protection_rules[]?.type] | index("required_reviewers") | not) | .name]')" >> "$GITHUB_OUTPUT"

  environment:
    needs: repo
    if: needs.repo.outputs.environments != '' && needs.repo.outputs.environments != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.repo.outputs.environments) }}
    environment: ${{ matrix.env }}
    steps:
      - name: Секреты окружения — имена и тип содержимого
        env:
          ALL: ${{ toJSON(secrets) }}
        run: |
          echo "Секреты, видимые в окружении ${{ matrix.env }} (вместе с секретами репозитория):"
          printf '%s' "$ALL" | jq -r '
            to_entries[] | select(.key != "github_token") | .value as $v
            | (try ($v | gsub("\\s"; "") | @base64d) catch "") as $d
            | "  \(.key) — " + (
                if ($v | contains("PRIVATE KEY")) then "ключ .p8 (текстом)"
                elif ($d | contains("PRIVATE KEY")) then "ключ .p8 (в base64)"
                elif ($v | contains("<plist")) then "plist (текстом)"
                elif ($d | contains("<plist")) then "plist (в base64)"
                elif ($v | test("^\\s*[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\\s*$")) then "похоже на Issuer ID"
                elif ($v | test("^\\s*[A-Z0-9]{10}\\s*$")) then "похоже на Key ID"
                elif ($v | test("^\\s*https?://")) then "адрес (URL)"
                elif ($v | test("^\\s*$")) then "пусто"
                else "другое" end)'
          echo "Переменные окружения есть: ${{ contains(toJSON(vars), '": ') }}"
