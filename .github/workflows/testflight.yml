name: TestFlight — сборка и загрузка

# Запуск: Actions → «TestFlight — сборка и загрузка» → Run workflow.
# Номер сборки = номер запуска этого workflow, версия — MARKETING_VERSION из проекта.
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID — ключ App Store Connect API (роль Admin: подпись в облаке Apple);
#   ASC_KEY_P8 — содержимое файла AuthKey_….p8 целиком (можно в base64);
#   AI_SERVER_PLIST — содержимое настоящего Markaryan/AIServer.plist целиком (можно в base64),
#   или вместо него AI_SERVER_URL (и при желании MARKET_SERVER_URL, APP_TOKEN).
# Подходят и распространённые другие имена (APP_STORE_CONNECT_…, fastlane), а ID ключа и издателя —
# также из переменных (vars). Значения ключей в журнал не выводятся.

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID || secrets.APP_STORE_CONNECT_API_KEY_ID || secrets.APP_STORE_CONNECT_API_KEY_KEY_ID || secrets.ASC_API_KEY_ID || secrets.APPSTORE_KEY_ID || secrets.API_KEY_ID || vars.ASC_KEY_ID || vars.APP_STORE_CONNECT_KEY_ID || vars.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID || secrets.ASC_API_ISSUER_ID || secrets.APPSTORE_ISSUER_ID || secrets.ISSUER_ID || vars.ASC_ISSUER_ID || vars.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 || secrets.APP_STORE_CONNECT_PRIVATE_KEY || secrets.APP_STORE_CONNECT_API_KEY_KEY || secrets.APP_STORE_CONNECT_KEY || secrets.ASC_PRIVATE_KEY || secrets.ASC_API_KEY || secrets.APPSTORE_PRIVATE_KEY || secrets.AUTH_KEY_P8 || secrets.P8_KEY }}
      AI_SERVER_PLIST: ${{ secrets.AI_SERVER_PLIST || secrets.AISERVER_PLIST || secrets.AI_SERVER_CONFIG || vars.AI_SERVER_PLIST }}
      AI_SERVER_URL: ${{ secrets.AI_SERVER_URL || vars.AI_SERVER_URL }}
      MARKET_SERVER_URL: ${{ secrets.MARKET_SERVER_URL || vars.MARKET_SERVER_URL }}
      APP_TOKEN: ${{ secrets.APP_TOKEN || vars.APP_TOKEN }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверка секретов
        id: check
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          [ -n "$AI_SERVER_PLIST" ] || [ -n "$AI_SERVER_URL" ] || missing="$missing AI_SERVER_PLIST"
          if [ -n "$missing" ]; then
            echo "::error::Не найдены:$missing. Добавьте их в Settings → Secrets and variables → Actions → Repository secrets (не в Environments)."
            exit 1
          fi

      - name: Какие ключи видит GitHub Actions (только имена и тип, без значений)
        if: failure() && steps.check.outcome == 'failure'
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Секреты репозитория (кроме служебного github_token):"
          printf '%s' "$ALL_SECRETS" | jq -r '
            to_entries[] | select(.key != "github_token") | .value as $v
            | (try ($v | gsub("\\s"; "") | @base64d) catch "") as $d
            | "  \(.key) — " + (
                if ($v | contains("PRIVATE KEY")) then "ключ .p8 (текстом)"
                elif ($d | contains("PRIVATE KEY")) then "ключ .p8 (в base64)"
                elif ($v | contains("<plist")) then "plist (текстом)"
                elif ($d | contains("<plist")) then "plist (в base64)"
                elif ($v | test("^\\s*[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\\s*$")) then "похоже на Issuer ID"
                elif ($v | test("^\\s*[A-Z0-9]{10}\\s*$")) then "похоже на Key ID"
                elif ($v | test("^\\s*https?://")) then "адрес (URL)"
                else "другое" end)'
          echo "Всего: $(printf '%s' "$ALL_SECRETS" | jq '[keys[] | select(. != "github_token")] | length')"
          echo "Переменные (vars) есть: ${{ contains(toJSON(vars), '": ') }}; в них ключ .p8: ${{ contains(toJSON(vars), 'PRIVATE KEY') || contains(toJSON(vars), 'LS0tLS1CRUdJTi') }}; plist: ${{ contains(toJSON(vars), '<plist') || contains(toJSON(vars), 'PD94bWw') }}"
          json=$(gh api "repos/$GITHUB_REPOSITORY/environments" 2>/dev/null || echo '{}')
          echo "Окружения (Environments) — их секреты видны только задаче с этим окружением:"
          printf '%s' "$json" | jq -r '(.environments // [])[] | "  \(.name) — правила: \([.protection_rules[]?.type] | if length == 0 then "нет" else join(", ") end)"'
          echo "Всего окружений: $(printf '%s' "$json" | jq '.total_count // 0')"

      - name: Настоящий AIServer.plist из секрета
        run: |
          file=Markaryan/AIServer.plist
          if [ -n "$AI_SERVER_PLIST" ]; then
            printf '%s\n' "$AI_SERVER_PLIST" > "$file"
            # Можно хранить и в base64.
            if ! grep -q "<plist" "$file"; then printf '%s' "$AI_SERVER_PLIST" | base64 --decode > "$file"; fi
          else
            /usr/libexec/PlistBuddy -c "Add :AI_SERVER_URL string $AI_SERVER_URL" "$file" >/dev/null
            /usr/libexec/PlistBuddy -c "Add :MARKET_SERVER_URL string ${MARKET_SERVER_URL:-$AI_SERVER_URL}" "$file" >/dev/null
            /usr/libexec/PlistBuddy -c "Add :APP_TOKEN string $APP_TOKEN" "$file" >/dev/null
          fi
          plutil -lint "$file"
          /usr/libexec/PlistBuddy -c "Print :AI_SERVER_URL" "$file" >/dev/null || { echo "::error::В AIServer.plist нет AI_SERVER_URL."; exit 1; }

      - name: Ключ App Store Connect API
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          key="$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          # Можно хранить и в base64.
          if ! grep -q "BEGIN PRIVATE KEY" "$key"; then printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key"; fi
          grep -q "BEGIN PRIVATE KEY" "$key" || { echo "::error::Ключ .p8 не распознан: нужен текст файла AuthKey_….p8 целиком."; exit 1; }
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Тесты калькуляторов и планировок
        run: sh Tests/run.sh

      - name: Архив (Release)
        run: |
          set -o pipefail
          xcodebuild -project Markaryan.xcodeproj -scheme Markaryan -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Markaryan.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive | tail -60

      - name: Загрузка в TestFlight
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>upload</string>
          <key>teamID</key><string>QFKA6588C4</string>
          <key>signingStyle</key><string>automatic</string>
          <key>uploadSymbols</key><true/>
          <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Markaryan.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40
          version=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$RUNNER_TEMP/Markaryan.xcarchive/Info.plist")
          echo "АртСтрой $version ($BUILD_NUMBER) загружен в App Store Connect. В TestFlight появится после обработки Apple, обычно за 5–30 минут." >> "$GITHUB_STEP_SUMMARY"

      - name: Убрать ключи с машины
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc" Markaryan/AIServer.plist
