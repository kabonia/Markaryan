name: Скриншоты экранов

on:
  push:
    branches: [ux-overhaul]
  workflow_dispatch:
    inputs:
      routes:
        description: "Экраны через пробел (home calcs design projects profile about assistant estimate calc:<вид> photocount photodesign onboarding)"
        default: "onboarding home calcs design projects profile about assistant estimate calc:concreteMix calc:masonry photocount photodesign"

jobs:
  shots:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Заглушка AIServer.plist
        run: |
          cat > Markaryan/AIServer.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>AI_SERVER_URL</key><string>https://ai.example.ru</string>
          <key>MARKET_SERVER_URL</key><string>https://ai.example.ru</string>
          <key>APP_TOKEN</key><string></string>
          </dict></plist>
          PLIST

      - name: Симулятор iPhone
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          phones=[x for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
          phones=phones or [x for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone')]
          print(phones[-1]['udid'])")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Сборка
        run: |
          set -o pipefail
          xcodebuild -project Markaryan.xcodeproj -scheme Markaryan -configuration Debug \
            -destination "id=$UDID" -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build | tail -5

      - name: Скриншоты
        env:
          ROUTES: ${{ github.event.inputs.routes || 'onboarding home calcs design projects profile about assistant estimate calc:concreteMix calc:masonry photocount photodesign' }}
        run: |
          APP=$(ls -d dd/Build/Products/Debug-iphonesimulator/*.app | head -1)
          BID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl privacy "$UDID" grant location "$BID" || true
          xcrun simctl location "$UDID" set 43.585,39.723 || true
          mkdir -p shots
          for r in ${ROUTES}; do
            xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
            if [ "$r" = "onboarding" ]; then
              xcrun simctl launch "$UDID" "$BID" -onboardingCompleted NO -screenshotRoute ""
            else
              xcrun simctl launch "$UDID" "$BID" -onboardingCompleted YES -screenshotRoute "$r"
            fi
            sleep 7
            xcrun simctl io "$UDID" screenshot "shots/$(echo $r | tr ':' '-').png"
          done
          for f in shots/*.png; do sips -s format jpeg -s formatOptions 60 -Z 800 "$f" --out "${f%.png}.jpg" >/dev/null; rm "$f"; done
          ls -la shots

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
