name: iOS — тесты и сборка

on:
  push:
    branches: [main, ux-overhaul, house-exterior, audit-2026-11, ui-audit-2026-11]
  pull_request:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Заглушка AIServer.plist (настоящий файл не хранится в git)
        run: |
          cat > Markaryan/AIServer.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>AI_SERVER_URL</key><string>https://ai.example.ru</string>
          <key>MARKET_SERVER_URL</key><string>https://ai.example.ru</string>
          <key>APP_TOKEN</key><string></string>
          </dict></plist>
          PLIST

      - name: Тесты калькуляторов и планировок
        run: |
          sh Tests/run.sh > tests.log 2>&1 || {
            # Ошибки компиляции и упавшие проверки — аннотациями (видно без скачивания журнала).
            grep -E "error:|FAIL|Fatal error" tests.log | sort -u | head -20 | sed 's/^/::error::/'
            tail -30 tests.log; exit 1; }
          grep -E "PASS|passed" tests.log

      - name: Сборка приложения для симулятора
        run: |
          set -o pipefail
          xcodebuild -project Markaryan.xcodeproj -scheme Markaryan \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || {
              # Ошибки компилятора — аннотациями: их видно на странице запуска без скачивания журнала.
              grep -E ": error:" build.log | sort -u | head -30 | sed 's/^/::error::/'
              tail -40 build.log
              exit 1
            }
          tail -20 build.log

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
